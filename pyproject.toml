[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grocery-optimizer"
version = "0.1.0"
description = "DC-metro grocery price optimization pipeline (bronze/silver/gold on DuckDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "playwright>=1.45",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "pytz>=2024.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
grocery-init-db = "grocery_optimizer.scripts.init_db:main"
grocery-kroger-keytest = "grocery_optimizer.scripts.kroger_key_test:main"
grocery-lidl-probe = "grocery_optimizer.scripts.lidl_probe:main"
grocery-kcl-fetch = "grocery_optimizer.scripts.kcl_fetch:main"
grocery-normalize = "grocery_optimizer.scripts.normalize:main"
grocery-wfm-fetch = "grocery_optimizer.scripts.wfm_fetch:main"
grocery-kroger-fetch = "grocery_optimizer.scripts.kroger_fetch:main"
grocery-tj-fetch = "grocery_optimizer.scripts.tj_fetch:main"
grocery-optimize = "grocery_optimizer.scripts.optimize_basket:main"
grocery-adjudicate = "grocery_optimizer.scripts.adjudicate:main"
grocery-seed-demo = "grocery_optimizer.scripts.seed_demo:main"
grocery-serve = "grocery_optimizer.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
