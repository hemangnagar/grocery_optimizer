[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grocery-optimizer"
version = "0.1.0"
description = "DC-metro grocery price optimization pipeline (bronze/silver/gold on DuckDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "playwright>=1.45",
    "rapidfuzz>=3.9",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
grocery-init-db = "grocery_optimizer.scripts.init_db:main"
grocery-kroger-keytest = "grocery_optimizer.scripts.kroger_key_test:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
