name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Windows is the production target (home-server deployment); Ubuntu keeps
    # the code honest about being genuinely cross-platform.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest
